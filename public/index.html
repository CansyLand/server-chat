<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<title>Claude</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Claude" />
<link rel="stylesheet" href="/style.css" />
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
</head>
<body>

<div id="gate">
  <div class="gate-box" id="gate-box">
    <p id="gate-message">Cannot GET /</p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <span class="title">Claude</span>
    <span id="status">connecting…</span>
    <button id="notify-btn" hidden type="button">Enable notifications</button>
    <button id="settings-btn" type="button" aria-label="Settings">⚙</button>
  </header>

  <p id="gate-hint" hidden class="hint">Add this to your Home Screen, then open it from there to enable notifications (iOS requirement).</p>

  <div id="auth-banner" hidden class="banner">
    <span>Connection isn't authorized. This may be temporary.</span>
    <button id="auth-repair-btn" type="button">Re-pair this device</button>
  </div>

  <main id="messages"></main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message Claude…" autocomplete="off"></textarea>
    <button type="submit" aria-label="Send">↑</button>
  </form>
</div>

<div id="settings-modal" hidden>
  <div class="settings-sheet">
    <div class="settings-row">
      <span>Version</span>
      <span id="settings-version">…</span>
    </div>
    <button id="settings-update-btn" type="button">Check for updates</button>
    <button id="settings-close-btn" type="button">Close</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
